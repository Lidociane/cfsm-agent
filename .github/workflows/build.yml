name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  cross-compile-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross compile representative targets
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="ci-${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          build_one() {
            goos="$1"
            goarch="$2"
            suffix="$3"
            goarm="${4:-}"
            gomips="${5:-}"
            output="dist/cf-probe-${goos}-${suffix}"
            if [ "$goos" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${goos}/${goarch} -> ${output}"
            GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" GOMIPS="$gomips" CGO_ENABLED=0 \
              go build -trimpath -ldflags="$LDFLAGS" -o "$output" ./cmd/cf-probe
          }

          build_one linux amd64 amd64
          build_one linux arm64 arm64
          build_one linux arm armv7 7
          build_one linux mips mips-softfloat "" softfloat
          build_one darwin arm64 arm64
          build_one windows amd64 amd64

